<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Event Overlay</title>

    <link rel="stylesheet" href="css/tailwind.min.css?v=20240802">
    <link rel="stylesheet" href="css/custom.css?v=20240802">

    <!-- GSAP (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="bg-transparent">
    <div id="overlay-container">
        <div id="corner-logos">
            <img id="logo-tl" class="absolute top-0 left-0 m-4 h-16" />
            <img id="logo-tr" class="absolute top-0 right-0 m-4 h-16" />
            <img id="logo-bl" class="absolute bottom-0 left-0 m-4 h-16" />
            <img id="logo-br" class="absolute bottom-0 right-0 m-4 h-16" />
        </div>
        <div id="preview-lower-third"></div>
        <div id="lower-third"></div>
        <div id="formation-overlay"></div>
        <div id="lineup-table-overlay"></div>
        <div id="results-overlay"></div>
        <div id="scoreboard-overlay"></div>
        <div id="high-break"></div>
        <div id="stat-overlay"></div>
        <div id="holdslate-overlay"></div>
        <div id="fixtures-overlay"></div>
        <div id="course-overlay"></div>
        <div id="event-title-overlay"></div>
        <div id="weather-overlay"></div>
        <div id="end-slate-overlay"></div>
        <div id="speakers-banner-overlay"></div>
        <div id="shootout-overlay"></div>
        <div id="standings-overlay"></div>
        <div id="log-overlay"></div>
        <div id="player-stat-overlay"></div>
        <div id="stoppage-overlay"></div>
        <div id="presentation-overlay"></div>
        <div id="program-overlay"></div>
        <div id="vt-overlay"></div>
        <div id="stinger-overlay"></div>
        <div id="title-slide"></div>
        <div id="category-reveal-overlay"></div>
        <div id="winner-announcement-overlay"></div>
        <div id="countdown-overlay"></div>
        <div id="sponsor-roll-overlay"></div>
        <div id="social-prompt-overlay"></div>
        <div id="agenda-overlay"></div>
        <div id="memoriam-overlay"></div>
        <div id="lyrics-overlay"></div>
        <div id="scripture-overlay"></div>
        <div id="service-agenda-overlay"></div>
        <div id="donation-overlay"></div>
        <div id="prayer-request-overlay"></div>
        <div id="announcement-overlay"></div>
    </div>

    <!-- Page-specific entry point -->
    <script type="module" src="js/main-overlay.js?v=20240802"></script>
</body>
</html>

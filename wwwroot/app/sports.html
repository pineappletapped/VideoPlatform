<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sports Admin</title>
    <link rel="stylesheet" href="css/tailwind.min.css?v=20240802">
    <link rel="stylesheet" href="css/custom.css?v=20240802">
</head>
<body class="sports-admin bg-gray-900 text-gray-100 min-h-screen flex flex-col">
    <div id="top-bar"></div>
    <div id="status-bar"></div>
    <div id="scoreboard-display" class="flex justify-center p-4"></div>
    <div class="flex-1 flex flex-col md:flex-row container mx-auto p-4 gap-4">
        <div id="left" class="flex-1 flex flex-col gap-4 min-w-[320px]"></div>
        <div id="right" class="flex-1 flex flex-col gap-4 min-w-[320px]">
            <div class="bg-gray-800 text-gray-100 rounded-lg shadow flex-1 flex flex-col">
                <div id="right-tabs" class="flex border-b mb-2">
                    <button data-tab="teams" class="px-4 py-2 border-b-2 border-brand text-brand font-semibold">Teams</button>
                    <button data-tab="stats" class="px-4 py-2">Stats</button>
                    <button data-tab="logs" class="px-4 py-2">Logs</button>
                </div>
                <div id="teams" class="tab-content flex-1 overflow-y-auto"></div>
                <div id="stats" class="tab-content flex-1 overflow-y-auto hidden"></div>
                <div id="logs" class="tab-content flex-1 overflow-y-auto hidden"></div>
            </div>
        </div>
    </div>
    <div id="branding-modal" class="hidden"></div>
    <script type="module" src="js/main-sports.js?v=20240802"></script>
</body>
</html>

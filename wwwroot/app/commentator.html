<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Commentator View</title>
    <link rel="stylesheet" href="css/custom.css?v=20240610">
    <script src="https://cdn.tailwindcss.com?v=20240610"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: '#e16316' } } } };
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
    <div id="top-bar"></div>
    <div id="status-bar"></div>
    <div class="container mx-auto p-4 flex flex-col md:flex-row gap-4 flex-1 overflow-y-auto">
        <div class="flex-1 space-y-4">
            <div id="scoreboard"></div>
            <div>
                <h2 class="font-bold text-lg mb-1">Match Log</h2>
                <ul id="logs" class="text-sm space-y-1"></ul>
            </div>
        </div>
        <div class="flex-1 space-y-4">
            <div id="lineups"></div>
            <div id="stats"></div>
        </div>
    </div>
    <script type="module" src="js/main-commentator.js?v=20240610"></script>
</body>
</html>
